name: Sailboat Simulation Tests

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'Rover/sailboat.*'
      - '.github/workflows/sailboat-tests.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'simulation/**'
      - 'tests/**'
      - 'Rover/sailboat.*'
  workflow_dispatch:  # Manual trigger

jobs:
  python-tests:
    name: Python Simulation Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run quick tests
        run: |
          cd tests
          python run_all_tests.py --quick

      - name: Run full test suite
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cd tests
          python run_all_tests.py

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: tests/reports/
          retention-days: 30

  wingsail-comparison:
    name: Wingsail Mode Comparison
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run wingsail comparison
        run: |
          cd tests
          python run_all_tests.py --wingsail

      - name: Upload comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: wingsail-comparison
          path: tests/reports/wingsail_comparison.*
          retention-days: 30

  storm-stability:
    name: Storm Stability Tests
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run storm stability tests
        run: |
          cd tests
          python run_all_tests.py --storm

      - name: Upload storm reports
        uses: actions/upload-artifact@v4
        with:
          name: storm-stability
          path: tests/reports/storm_stability.*
          retention-days: 30
